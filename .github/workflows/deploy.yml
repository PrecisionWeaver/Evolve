name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # --ignore-scripts skips the `node` package's installer, which downloads an old Node binary we don't need
      - run: npm ci --ignore-scripts

      - run: npm run build

      # Same file set as `npm run deploy`, plus package.json for the in-game version check
      - name: Assemble site
        run: |
          mkdir dist
          cp -r *.html *.ico LICENSE package.json evolve lib font strings wiki dist
          find dist -name '*.map' -delete

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
